<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certifications</title>

<link href="bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

/* ===== LAYOUT ===== */
html, body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #12161c;
  transition: background 0.3s ease, color 0.3s ease;
}

.page-wrap {
  flex: 1;
  max-width: 1000px;
}

.back-home {
  text-decoration: none;
  color: #374151;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.25s ease, transform 0.25s ease;
}

.back-home i {
  transition: transform 0.28s ease;
}

.back-home:hover i {
  transform: translateX(-6px);
}

.back-home:hover {
  transform: translateX(-2px);
}

.title {
  font-size: 36px;
  font-weight: 700;
}

.subtitle {
  color: #6b7280;
  margin-top: 5px;
}

/* ===== CARD ===== */
.cert-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid rgba(100,116,139,0.25);
  padding: 15px;
  transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  animation: card-reveal 0.55s ease both;
}

.cert-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
}

/* IMAGE */
.cert-img-link {
  display: block;
  border-radius: 8px;
  cursor: zoom-in;
}

.cert-img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 12px;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.cert-img-link:hover .cert-img {
  transform: scale(1.02);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
}

/* TEXT */
.cert-title {
  font-weight: 600;
  font-size: 15px;
}

.cert-meta {
  font-size: 13px;
  color: #6b7280;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  font-size: 16px;
  color: #6b7280;
  padding: 18px 0;
  position: relative;
  margin-top: auto;
  width: 100%;
}

.footer::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  height: 1px;
  background: linear-gradient(
    to right,
    transparent,
    rgba(148,163,184,0.6),
    transparent
  );
}

/* ===== DARK MODE ===== */
.theme-dark {
  background: #101317;
  color: #eef2f7;
}

.theme-dark .subtitle,
.theme-dark .cert-meta,
.theme-dark .footer {
  color: #9ca3af;
}

.theme-dark .back-home {
  color: #e5e7eb;
}

.theme-dark .cert-card {
  background: #161b22;
  border-color: rgba(148,163,184,0.2);
}

.theme-dark .footer::before {
  background: linear-gradient(to right, transparent, rgba(148,163,184,0.3), transparent);
}

.theme-light {
  background: #f4f6f8;
  color: #12161c;
}

.theme-light .back-home {
  color: #374151;
}

.theme-light .subtitle {
  color: #6b7280;
}

.theme-light .cert-card {
  background: #fff;
  border-color: rgba(100,116,139,0.25);
}

.theme-light .footer {
  color: #6b7280;
}

.img-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.75);
  z-index: 9999;
  padding: 1rem;
}

.img-modal.show {
  display: flex;
}

.img-modal-content {
  max-width: min(92vw, 980px);
  max-height: 85vh;
  border-radius: 10px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
}

@keyframes card-reveal {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 575.98px) {
  .title {
    font-size: clamp(24px, 7vw, 36px);
  }

  .subtitle {
    font-size: clamp(13px, 3.5vw, 15px);
  }

  .back-home {
    font-size: clamp(13px, 3.5vw, 15px);
    gap: 4px;
  }

  .cert-card {
    padding: 1rem;
  }

  .cert-img {
    height: clamp(200px, 50vw, 300px);
    margin-bottom: 10px;
  }

  .cert-title {
    font-size: clamp(13px, 3.5vw, 15px);
  }

  .cert-meta {
    font-size: clamp(11px, 3vw, 13px);
  }

  .page-wrap {
    max-width: 100%;
    padding: 0 0.75rem;
  }

  .container {
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  .header-bar {
    margin-bottom: 1rem;
  }
}

@media (max-width: 380px) {
  .title {
    font-size: clamp(20px, 6vw, 24px);
  }

  .back-home {
    font-size: clamp(12px, 3vw, 14px);
  }

  .cert-card {
    padding: 0.75rem;
  }

  .cert-img {
    height: clamp(160px, 45vw, 220px);
    margin-bottom: 8px;
  }

  .cert-title {
    font-size: clamp(12px, 3vw, 14px);
  }

  .cert-meta {
    font-size: clamp(10px, 2.8vw, 12px);
  }
}

</style>
</head>

<body class="theme-light">

<div class="container page-wrap py-5">

  <div class="header-bar mb-4">
    <a href="index.html" class="back-home">
      <i class="bi bi-arrow-left"></i>
      Back to Home
    </a>
  </div>

  <div class="mb-4">
    <div class="title">Certifications</div>
    <div class="subtitle">
      Here are my certifications, reflecting continuous learning and professional growth.
    </div>
  </div>

  <div class="row g-4" id="certContainer"></div>

</div>

<!-- FOOTER -->
<div class="footer">
  © 2026 Jim Godwin Panganiban. All Rights Reserved.
</div>

<div class="img-modal" id="imgModal">
  <img id="imgModalContent" class="img-modal-content" src="" alt="Certificate preview">
</div>

<script>

/* ===== my certificates ===== */
const certs = [
  {
    title: "Technical Support Fundamentals",
    org: "Coursera - Google",
    year: "2026",
    img: "assets/certificates/technical-support-fundamentals.png"
  },
  {
    title: "Web Development using PHP and MySQL",
    org: "Department of Information Communication Technology",
    year: "2026",
    img: "assets/certificates/web-development-using-php-and-mysql.png"
  },
  {
    title: "Software Development & Design Thinking",
    org: "Department of Information Communication Technology",
    year: "2025",
    img: "assets/certificates/software-development-and-design-thinking.png"
  },
  {
    title: "Web Development using MERN Stack",
    org: "Department of Information Communication Technology",
    year: "2025",
    img: "assets/certificates/mern-stack.png"
  }
];

/* ===== RENDER ===== */
const container = document.getElementById("certContainer");

certs.forEach(cert => {
  const col = document.createElement("div");
  col.className = "col-md-6";

  col.innerHTML = `
    <div class="cert-card">
      <a href="#" class="cert-img-link" data-preview="${cert.img}">
        <img src="${cert.img}" class="cert-img" alt="${cert.title}">
      </a>
      <div class="cert-title">${cert.title}</div>
      <div class="cert-meta">${cert.org} • ${cert.year}</div>
    </div>
  `;

  container.appendChild(col);
});

const imgModal = document.getElementById("imgModal");
const imgModalContent = document.getElementById("imgModalContent");

document.addEventListener("click", (event) => {
  const trigger = event.target.closest(".cert-img-link");
  if (trigger) {
    event.preventDefault();
    const imageSrc = trigger.getAttribute("data-preview");
    imgModalContent.src = imageSrc;
    imgModal.classList.add("show");
    return;
  }

  if (event.target === imgModal) {
    imgModal.classList.remove("show");
    imgModalContent.src = "";
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    imgModal.classList.remove("show");
    imgModalContent.src = "";
  }
});

window.onload = () => {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") {
    document.body.classList.add("theme-dark");
    document.body.classList.remove("theme-light");
  } else {
    document.body.classList.add("theme-light");
    document.body.classList.remove("theme-dark");
  }
};

</script>

</body>
</html>
