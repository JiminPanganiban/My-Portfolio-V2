<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Tech Stack</title>

<link href="bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

html, body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #12161c;
  transition: background 0.3s ease, color 0.3s ease;
}

.page-wrap {
  flex: 1;
  max-width: 1000px;
}

/* ================== HEADER ================== */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* BACK BUTTON */
.back-home {
  text-decoration: none;
  color: #374151;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.25s ease, transform 0.25s ease;
}

.back-home i {
  transition: transform 0.28s ease;
}

.back-home:hover i {
  transform: translateX(-4px);
}

.back-home:hover {
  transform: translateX(-2px);
}

/* ================== TITLE ================== */
.title {
  font-size: 34px;
  font-weight: 700;
  animation: fade-slide 0.55s ease both;
}

.subtitle {
  color: #6b7280;
}

/* ================== CARDS ================== */
.tech-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid rgba(100,116,139,0.25);
  padding: 20px;
  transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  animation: fade-slide 0.55s ease both;
}

.tech-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
}

.tech-header {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chip {
  display: inline-block;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid rgba(148,163,184,0.35);
  background: #fff;
  margin: 3px;
  transition: 0.2s;
}

.chip:hover {
  background: #f1f5f9;
}

/* ================== FOOTER ================== */
.footer {
  text-align: center;
  font-size: 16px;
  color: #6b7280;
  padding: 18px 0;
  position: relative;
  margin-top: auto;
  width: 100%;
}

.footer::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(148,163,184,0.6), transparent);
}

/* ================== DARK MODE ================== */
.theme-dark {
  background: #101317;
  color: #eef2f7;
}

.theme-dark .tech-card {
  background: #161b22;
  border-color: rgba(148,163,184,0.2);
}

.theme-dark .chip {
  background: #1f2933;
  border-color: rgba(148,163,184,0.2);
  color: #e5e7eb;
}

.theme-dark .chip:hover {
  background: #2d3748;
}

.theme-dark .subtitle {
  color: #9ca3af;
}

.theme-dark .back-home {
  color: #e5e7eb;
}

.theme-dark .footer {
  color: #9ca3af;
}

.theme-dark .footer::before {
  background: linear-gradient(to right, transparent, rgba(148,163,184,0.3), transparent);
}

.theme-light {
  background: #f4f6f8;
  color: #12161c;
}

.theme-light .subtitle {
  color: #6b7280;
}

.theme-light .back-home {
  color: #374151;
}

.theme-light .tech-card {
  background: #fff;
  border-color: rgba(100,116,139,0.25);
}

.theme-light .chip {
  background: #fff;
  border-color: rgba(148,163,184,0.35);
  color: #12161c;
}

.theme-light .chip:hover {
  background: #f1f5f9;
}

  @media (max-width: 575.98px) {
    .title {
      font-size: clamp(24px, 7vw, 34px);
    }

    .subtitle {
      font-size: clamp(13px, 3.5vw, 15px);
    }

    .back-home {
      font-size: clamp(13px, 3.5vw, 15px);
      gap: 4px;
    }

    .tech-card {
      padding: 1rem;
    }

    .tech-header {
      font-size: clamp(13px, 3.5vw, 15px);
      margin-bottom: 10px;
    }

    .chip {
      padding: 5px 8px;
      font-size: clamp(11px, 3vw, 13px);
      margin: 2px;
    }

    .page-wrap {
      max-width: 100%;
      padding: 0 0.75rem;
    }

    .container {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
    }
  }

  @media (max-width: 380px) {
    .title {
      font-size: clamp(20px, 6vw, 24px);
    }

    .tech-card {
      padding: 0.75rem;
    }

    .tech-header {
      font-size: clamp(12px, 3vw, 14px);
    }

    .chip {
      padding: 4px 6px;
      font-size: clamp(10px, 2.8vw, 12px);
    }
  }

</style>
</head>

<body class="theme-light">

<div class="container page-wrap py-5">

  <!-- HEADER -->
  <div class="header-bar mb-4">
    <a href="index.html" class="back-home">
      <i class="bi bi-arrow-left"></i>
      Back to Home
    </a>
  </div>

  <!-- TITLE -->
  <div class="mb-4">
    <div class="title">Tools / Softwares</div>
    <div class="subtitle">Comprehensive list of tools and technologies I use.</div>
  </div>

  <!-- GRID -->
  <div class="row g-4" id="techContainer"></div>

</div>

<!-- FOOTER -->
<div class="footer">
  © 2026 Jim Godwin Panganiban. All Rights Reserved.
</div>

<script>
const techData = [
  { 
    title: "Office Productivity", 
    icon: "bi-file-earmark-text", 
    tools: ["MS Word","Excel","PowerPoint","Microsoft Teams","Zoom"] 
  },
  { 
    title: "Developer Tools", 
    icon: "bi-tools", 
    tools: ["VS Code","MySQL","Firebase"] 
  },
  { 
    title: "Web Development (Frontend)", 
    icon: "bi-window", 
    tools: ["HTML","CSS","JavaScript","Bootstrap"] 
  },
  { 
    title: "Web Development (Backend & Database)", 
    icon: "bi-hdd-stack", tools: ["C#","PHP","MySQL","Firebase"] 
  },
  { 
    title: "Graphics Design", 
    icon: "bi-palette", 
    tools: ["Canva","Inkscape","GIMP","Adobe Photoshop"] 
  },
  { 
    title: "Video Editing", 
    icon: "bi-camera-video", 
    tools: ["Canva","CapCut","DaVinci Resolve"] 
  },
  { 
    title: "AI Tools", 
    icon: "bi-cpu", 
    tools: ["Copilot","ChatGPT","Gemini","Cursor","Google AI Studio"] }
];

const container = document.getElementById("techContainer");

techData.forEach(section => {
  const col = document.createElement("div");
  col.className = "col-md-6";

  col.innerHTML = `
    <div class="tech-card">
      <div class="tech-header">
        <i class="bi ${section.icon}"></i> ${section.title}
      </div>
      ${section.tools.map(t => `<span class="chip">${t}</span>`).join("")}
    </div>
  `;

  container.appendChild(col);
});

window.onload = () => {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") {
    document.body.classList.add("theme-dark");
    document.body.classList.remove("theme-light");
  } else {
    document.body.classList.add("theme-light");
    document.body.classList.remove("theme-dark");
  }
};
</script>

</body>
</html>
